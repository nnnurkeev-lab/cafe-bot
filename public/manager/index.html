<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cafe Manager</title>
  <link rel="stylesheet" href="/manager/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Cafe Bot</p>
        <h1>Панель менеджера</h1>
      </div>
      <div class="topbar-actions">
        <p id="lastUpdated" class="last-updated">Загрузка...</p>
        <button id="refreshButton" class="ghost-button" type="button">Обновить</button>
        <button id="logoutButton" class="ghost-button hidden" type="button">Выйти</button>
      </div>
    </header>

    <main>
      <section id="loginCard" class="login-card">
        <h2>Вход для менеджера</h2>
        <p>Введите пароль, который задан в переменной окружения <code>MANAGER_WEB_PASSWORD</code>.</p>
        <form id="loginForm" class="login-form">
          <input id="passwordInput" name="password" type="password" placeholder="Пароль менеджера" autocomplete="current-password" required>
          <button type="submit">Войти</button>
        </form>
        <p id="loginError" class="error-text hidden"></p>
      </section>

      <section id="boardSection" class="board-section hidden">
        <section class="chat-workspace">
          <div class="chat-sidebar">
            <div class="column-header">
              <h2>Обращения</h2>
              <span id="chatCount" class="count-badge">0</span>
            </div>
            <div id="chatThreads" class="chat-thread-list"></div>
          </div>

          <div class="chat-panel">
            <div class="column-header">
              <div>
                <h2 id="chatPanelTitle">Диалог с клиентом</h2>
                <p id="chatPanelSubtitle" class="chat-subtitle">Выберите обращение слева</p>
              </div>
            </div>

            <div id="chatMessages" class="chat-messages">
              <div class="empty-state">Пока нет активных обращений</div>
            </div>

            <form id="chatForm" class="chat-form">
              <textarea id="chatInput" rows="3" placeholder="Напишите ответ клиенту..." disabled></textarea>
              <button id="chatSendButton" type="submit" disabled>Отправить</button>
            </form>
          </div>
        </section>

        <div class="board-grid">
          <section class="column pending-column">
            <div class="column-header">
              <h2>Ожидающие</h2>
              <span id="count-pending" class="count-badge">0</span>
            </div>
            <div id="column-pending" class="cards"></div>
          </section>

          <section class="column cooking-column">
            <div class="column-header">
              <h2>В процессе</h2>
              <span id="count-cooking" class="count-badge">0</span>
            </div>
            <div id="column-cooking" class="cards"></div>
          </section>

          <section class="column ready-column">
            <div class="column-header">
              <h2>Готовы</h2>
              <span id="count-ready" class="count-badge">0</span>
            </div>
            <div id="column-ready" class="cards"></div>
          </section>

          <section class="column courier-column">
            <div class="column-header">
              <h2>В пути</h2>
              <span id="count-courier" class="count-badge">0</span>
            </div>
            <div id="column-courier" class="cards"></div>
          </section>
        </div>

        <section class="archive-panel">
          <div class="column-header">
            <h2>Завершённые</h2>
            <span id="count-done" class="count-badge">0</span>
          </div>
          <div id="column-done" class="cards archive-cards"></div>
        </section>
      </section>
    </main>
  </div>

  <template id="orderCardTemplate">
    <article class="order-card">
      <div class="card-head">
        <div>
          <p class="order-code"></p>
          <h3 class="customer-name"></h3>
        </div>
        <span class="status-pill"></span>
      </div>

      <div class="meta-grid">
        <div>
          <span class="label">Телефон</span>
          <p class="phone"></p>
        </div>
        <div>
          <span class="label">Время</span>
          <p class="delivery-time"></p>
        </div>
        <div class="meta-grid-wide">
          <span class="label">Адрес</span>
          <p class="address"></p>
        </div>
      </div>

      <div class="items-block">
        <span class="label">Позиции</span>
        <ul class="items-list"></ul>
      </div>

      <div class="summary-row">
        <div>
          <span class="label">Сумма</span>
          <p class="total"></p>
        </div>
        <div>
          <span class="label">Оплата</span>
          <p class="payment"></p>
        </div>
      </div>

      <div class="comment-block">
        <span class="label">Комментарий</span>
        <p class="comment"></p>
      </div>

      <div class="eta-block hidden">
        <span class="label">ETA</span>
        <p class="eta"></p>
      </div>

      <div class="actions"></div>
    </article>
  </template>

  <script src="/manager/app.js" defer></script>
</body>
</html>
